[project]
name = "nightshift"
version = "1.0.0"
description = "Night Shift — proof-carrying rescue state machine for research freezer incidents"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-pubsub>=2.27.0",
    "google-cloud-storage>=2.19.0",
    "google-cloud-kms>=3.1.0",
    "google-auth>=2.37.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-gcp-trace>=1.9.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "cryptography>=44.0.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
]

[project.scripts]
nightshift-verify = "nightshift.verify.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.122.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-pyyaml>=6.0.12",
    "anyio>=4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nightshift", "services", "agents", "assurance"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "apps", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",   # assert is fine in tests and kernel contracts
    "S311",   # deterministic seeded PRNG for fixtures is intentional, not crypto
    "B008",   # FastAPI Depends() in defaults is the framework idiom
    "RUF012", # ClassVar annotations not required for our small mutable defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E501"]
"assurance/**" = ["S105", "S106"]
"scripts/**" = ["S603", "S607", "T201"]
"infra/**" = ["S603", "S607", "T201"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
files = ["nightshift", "services", "agents", "assurance"]

[[tool.mypy.overrides]]
module = [
    "google.adk.*",
    "google.genai.*",
    "google.cloud.*",
    "opentelemetry.exporter.*",
    "yaml",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
